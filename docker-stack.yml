version: "3.8"

# ============================================================================
# OpenClaw - Portainer Stack (Ollama Edition)
#
# Pré-requisito: construir a imagem antes de criar esta stack:
#   bash <(curl -sSL https://raw.githubusercontent.com/carloedvandro/openclawd/main/scripts/build-image.sh)
#
# Depois, cole este arquivo como nova stack no Portainer.
# ============================================================================

services:
  gateway:
    image: openclaw-ollama:latest
    ports:
      - "18789:18789"
    environment:
      - NODE_ENV=production
      - OLLAMA_API_KEY=ollama
      - OLLAMA_BASE_URL=https://apiollama.ychat-ia.com.br/v1
    volumes:
      - openclaw-data:/home/node/.openclaw
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openclaw-data:
