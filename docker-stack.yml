version: "3.8"

# ============================================================================
# OpenClaw Docker Swarm Stack (Ollama Edition)
#
# Deploy:
#   docker stack deploy -c docker-stack.yml openclaw
#
# Remove:
#   docker stack rm openclaw
# ============================================================================

services:
  openclaw:
    image: openclaw-ollama:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "18789:18789"
    environment:
      - NODE_ENV=production
      - OLLAMA_API_KEY=ollama
      - OLLAMA_BASE_URL=https://apiollama.ychat-ia.com.br/v1
    volumes:
      - openclaw-data:/home/node/.openclaw
    configs:
      - source: openclaw-config
        target: /home/node/.openclaw/openclaw.json
        uid: "1000"
        gid: "1000"
        mode: 0600
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    networks:
      - openclaw-net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

configs:
  openclaw-config:
    file: ./openclaw-config.json

volumes:
  openclaw-data:

networks:
  openclaw-net:
    driver: overlay
